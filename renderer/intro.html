<!DOCTYPE html>
<!-- Abertura do AuGPT (19/10, animação feita pelo Davi com o Claude: augpt-intro-v4.html).
     Roda numa janela própria, transparente e do tamanho da principal (electron/abertura.js): na
     tela aparece só a caixa pequena, que cresce até virar a janela do app, como no Opera GX. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
<title>AuGPT</title>
<style>
  :root{--ember:#e8774a;--amber:#f2b36b;--cream:#f6e7d4;--rust:#8a3b22;--bg:#120e0b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;overflow:hidden;color:var(--cream);
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}

  /* ===== INTRO ===== */
  #intro{position:fixed;inset:0;z-index:10;background:transparent}
  #stage{position:absolute;inset:0;visibility:hidden;will-change:transform}
  #box{position:absolute;left:50%;top:50%;width:240px;height:240px;border-radius:30px;overflow:hidden;
    background:#150f0b;opacity:0;transform:translate(-50%,-50%) scale(.7);
    box-shadow:0 0 70px rgba(232,119,74,.22)}
  #gl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100vw;height:100vh;display:block}
  #logo{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;overflow:visible}
  #logo path{fill:none;stroke:url(#gLogo);stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
  #logo circle{transform-box:fill-box;transform-origin:center;transform:scale(0)}
  #frame{position:absolute;left:50%;top:50%;width:248px;height:248px;margin:-124px 0 0 -124px;opacity:0;overflow:visible}
  #frameRect{fill:none;stroke:url(#gFrame);stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #flash{position:absolute;inset:0;opacity:0;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,rgba(255,236,208,.95) 0%,rgba(255,160,90,.45) 35%,rgba(255,120,60,0) 72%)}
  #wordWrap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none}
  #word{font-size:clamp(56px,12vw,160px);font-weight:700;line-height:1;white-space:nowrap;color:var(--cream);
    text-shadow:0 0 36px rgba(232,119,74,.55),0 0 90px rgba(232,119,74,.25)}
  #word span{display:inline-block;opacity:0}
  #tag{margin-top:18px;font-size:clamp(11px,1.6vw,17px);letter-spacing:.38em;text-transform:uppercase;
    color:var(--amber);opacity:0}
  #start{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-size:14px;letter-spacing:.2em;
    text-transform:uppercase;color:#b69a82;cursor:pointer;animation:pulse 1.6s ease-in-out infinite;display:none}
  #hint{position:absolute;right:18px;bottom:14px;font-size:12px;color:#6b584a;opacity:0;transition:opacity .4s}
  @keyframes pulse{50%{opacity:.35}}
</style>
</head>
<body>

<div id="intro">
  <div id="stage">
    <div id="box">
      <canvas id="gl"></canvas>
      <svg id="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gLogo" gradientUnits="userSpaceOnUse" x1="20" y1="14" x2="100" y2="106">
            <stop offset="0" stop-color="#f6c98a"/><stop offset=".55" stop-color="#e8774a"/><stop offset="1" stop-color="#b5502e"/>
          </linearGradient>
          <linearGradient id="gSheen" gradientUnits="userSpaceOnUse" x1="-60" y1="0" x2="-10" y2="40">
            <stop offset="0" stop-color="#fff4e2" stop-opacity="0"/>
            <stop offset=".5" stop-color="#fff4e2" stop-opacity=".95"/>
            <stop offset="1" stop-color="#fff4e2" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path id="pHex" pathLength="1" stroke-width="3.5" d="M60 14 L100 37 L100 83 L60 106 L20 83 L20 37 Z"/>
        <path id="pA"   pathLength="1" stroke-width="6.5" d="M36 84 L60 34 L84 84"/>
        <path id="pBar" pathLength="1" stroke-width="5.5" d="M46 68 L74 68"/>
        <circle id="nApex" cx="60" cy="34" r="6.5" fill="#fff1de"/>
        <circle id="n1" cx="100" cy="37" r="3.6" fill="#f2b36b"/>
        <circle id="n2" cx="20" cy="83" r="3.6" fill="#e8774a"/>
      </svg>
    </div>
    <svg id="frame" viewBox="0 0 248 248" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gFrame" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="248" y2="248">
          <stop offset="0" stop-color="#f6c98a"/><stop offset="1" stop-color="#d9623a"/>
        </linearGradient>
      </defs>
      <rect id="frameRect" pathLength="1" x="4" y="4" width="240" height="240" rx="30"/>
    </svg>
    <canvas id="fx"></canvas>
    <div id="flash"></div>
    <div id="wordWrap">
      <div id="word"><span>A</span><span>u</span><span>G</span><span>P</span><span>T</span></div>
      <div id="tag">agente autônomo local</div>
    </div>
  </div>
  <div id="hint">Esc / clique para pular</div>
</div>

<script src="intro.js"></script>
</body>
</html>
