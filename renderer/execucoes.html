<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: augpt-img:; frame-src 'self' data:" />
  <title>AuGPT — Execuções</title>
  <!-- styles.css (tokens, .chip, .exec-*) + tema.css (identidade "Au", tema claro) + o
       layout desta janela em execucoes.css. Refeita em 22/10 no padrão da tela do agente. -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="tema.css" />
  <link rel="stylesheet" href="execucoes.css" />
  <script src="tema.js"></script>
  <script src="i18n.js"></script>
</head>
<body class="exec-corpo">
  <div class="exec-3col">
    <!-- 1: buscar e escolher -->
    <section class="exec-col exec-col-lista">
      <header class="exec-col-topo">
        <div class="exec-titulo"><span class="tile"><span class="sym">Au</span></span><h1>Execuções</h1><span class="exec-total" id="execTotal"></span></div>
        <input type="search" id="execBusca" class="exec-busca" placeholder="Buscar por pedido, modelo ou caso…" />
        <div class="filtro-origem" id="execFiltroOrigem">
          <button class="chip ativo" data-origem="">tudo</button>
          <button class="chip" data-origem="app">uso real</button>
          <button class="chip" data-origem="bancada">bancada</button>
        </div>
      </header>
      <div class="exec-col-rolagem" id="execLista"></div>
    </section>

    <!-- 2: a execução escolhida -->
    <section class="exec-col exec-col-detalhe">
      <div class="exec-col-rolagem">
        <div class="exec-detalhe" id="execDetalhe">
          <div class="exec-vazio">
            <span class="tile"><span class="sym">Au</span></span>
            <h2>Escolha uma execução</h2>
            <p>À esquerda, cada pergunta ou tarefa. Aqui aparece o que o agente fez: onde o tempo foi, o que buscou, o que leu e o que respondeu.</p>
          </div>
        </div>
      </div>
    </section>

    <!-- 3: tendência da lista filtrada -->
    <section class="exec-col exec-col-tendencia">
      <header class="exec-col-topo">
        <div class="exec-titulo"><h2>Tendência</h2></div>
        <div class="exec-toggle" id="execToggleMetrica">
          <button class="chip ativo" data-metrica="tempo">tempo</button>
          <button class="chip" data-metrica="tokens">tokens</button>
        </div>
      </header>
      <div class="exec-col-rolagem" id="execTendencia"></div>
    </section>
  </div>

  <script src="grafico.js"></script>
  <script src="md.js"></script>
  <script src="execucoes.js"></script>
</body>
</html>
